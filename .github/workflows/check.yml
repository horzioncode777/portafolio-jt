name: Comprobar portafolio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Probar el verificador
        run: python -m unittest discover -s tests
      - name: Comprobar JavaScript
        run: python scripts/check_site.py --syntax
      - name: Construir sitio
        run: |
          node build-pages.cjs
          node prepare-vercel.cjs
      - name: Comprobar archivos y enlaces internos
        run: python scripts/check_site.py vercel-public
