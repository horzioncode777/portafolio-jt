name: Comprobar portafolio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Probar el verificador
        run: python -m unittest discover -s tests
      - name: Comprobar JavaScript
        run: python scripts/check_site.py --syntax
      - name: Construir sitio
        run: |
          node build-pages.cjs
          node prepare-vercel.cjs
      - name: Comprobar archivos y enlaces internos
        run: python scripts/check_site.py vercel-public
